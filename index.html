<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0713">
<title>Ryner Hub Key</title>
<style>
:root{--bg:#0b0713;--card:#120c1d;--line:#2b1e45;--tx:#f5f0ff;--mut:#a597c0;--acc:#a855f7;--acc2:#c9a2ff;--warn:#ff7b9c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;background:radial-gradient(900px 420px at 50% -80px,rgba(168,85,247,.28),transparent 70%),var(--bg)}
main{max-width:560px;margin:0 auto;padding:28px 18px 48px}
.pill{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;border:1px solid var(--line);background:rgba(18,12,29,.7);border-radius:999px;padding:10px 18px;font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.pill b{color:var(--acc2);font-weight:600}
h1{font-size:clamp(34px,10vw,52px);line-height:1.05;text-align:center;margin:26px 0 12px;letter-spacing:-.03em;background:linear-gradient(180deg,#fff 30%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mut);margin:0 0 26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:12px;padding:6px 12px;font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--mut)}
.bar{height:6px;border-radius:6px;background:var(--line);margin:16px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--tx);padding:10px 16px}
button.main{background:var(--acc);color:#fff;border-color:var(--acc);padding:14px 26px;box-shadow:0 6px 24px rgba(168,85,247,.35)}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
button:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.hint{color:var(--mut);font-size:14px;margin:0}
.key{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.code{font:600 17px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:var(--acc2)}
.msg{min-height:20px;margin:0 0 14px;text-align:center;font-size:14px;color:var(--acc2)}
.msg.err{color:var(--warn)}
</style>
</head>
<body>
<main>
  <div class="pill"><span class="dot"></span><b>Key Gateway</b><span>No Expiry</span><span>1 Key / Device</span></div>
  <h1>Get Ryner Hub Key</h1>
  <p class="sub">Selesaikan 2 checkpoint (masing-masing 2 tahap) untuk mendapatkan key. Key berlaku sampai script di-update.</p>
  <p id="msg" class="msg" role="status"></p>
  <section class="card">
    <div class="row">
      <strong style="font-size:20px">Progress</strong>
      <span class="chip" id="chipTotal">0 / 4</span>
      <button class="main" id="go" disabled>Memuat...</button>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <p class="hint" id="hint"></p>
  </section>
  <section class="card">
    <div class="row"><strong style="font-size:20px">Your key <span class="chip" id="cnt">0 / 1</span></strong></div>
    <div id="list"></div>
  </section>
</main>

<script>
// ===== KONFIGURASI =====
// Tujuan (destination) tiap safelink: https://NAMA-KAMU.vercel.app/?s=1 , ?s=2 , ?s=3 , ?s=4
const CFG = {
  api: "https://qnvoipytnavzgmwfqkms.supabase.co/functions/v1/gateway",
  checkpoint1: ["https://sfl.gl/JvlK", "https://sfl.gl/MlkNh7"],
  checkpoint2: ["https://sfl.gl/kOV9U", "https://sfl.gl/ztLz"]
};
// =======================
const LINKS = [...CFG.checkpoint1, ...CFG.checkpoint2];
const ERR = {
  too_fast: "Terlalu cepat. Selesaikan safelink sampai akhir, lalu ulangi dari tombol Lanjut.",
  order: "Urutan tidak valid. Mulai lagi dari tombol Lanjut.",
  expired: "Waktu habis. Ulangi dari tombol Lanjut.",
  ip_limit: "Batas pembuatan key dari jaringan ini tercapai. Coba lagi besok.",
  has_key: "Kamu sudah punya key.",
  not_done: "Selesaikan semua checkpoint dulu."
};
const $ = id => document.getElementById(id);
const say = (t, err) => { const m = $("msg"); m.textContent = t || ""; m.className = "msg" + (err ? " err" : ""); };
let S = {step:0, key:null, sid:null}, busy = false;

async function call(route, body){
  try{
    const r = await fetch(CFG.api + "/" + route, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({sid:S.sid, ...body})});
    return await r.json();
  }catch(e){ return {error:"net"}; }
}
async function sync(){
  let sid = null; try{ sid = localStorage.getItem("rh_sid"); }catch(e){}
  S.sid = sid;
  const d = await call("start", {});
  if(d.error){ say("Gagal terhubung ke server. Coba muat ulang.", true); return false; }
  S = {sid:d.sid, step:d.step, key:d.key};
  try{ localStorage.setItem("rh_sid", d.sid); }catch(e){}
  return true;
}
function render(){
  const go = $("go");
  $("cnt").textContent = (S.key ? 1 : 0) + " / 1";
  $("chipTotal").textContent = S.step + " / 4";
  $("fill").style.width = (S.step / 4 * 100) + "%";
  if(S.key){ go.textContent = "Key sudah dibuat"; go.disabled = true; $("hint").textContent = "1 key untuk 1 perangkat. Salin key kamu di bawah."; }
  else if(S.step < 4){
    go.textContent = "Lanjut"; go.disabled = busy;
    $("hint").textContent = `Checkpoint ${S.step < 2 ? 1 : 2}, tahap ${S.step % 2 + 1} dari 2: tekan Lanjut, selesaikan safelink, lalu kamu kembali ke sini otomatis.`;
  } else { go.textContent = "Claim Key"; go.disabled = busy; $("hint").textContent = "Semua checkpoint selesai. Klaim key kamu."; }
  const l = $("list"); l.innerHTML = "";
  if(!S.key){ l.innerHTML = '<p class="hint" style="margin-top:12px">Belum ada key. Selesaikan checkpoint untuk membuat key.</p>'; return; }
  const d = document.createElement("div"); d.className = "key";
  d.innerHTML = '<div class="code"></div><button>Copy</button>';
  d.querySelector(".code").textContent = S.key;
  d.querySelector("button").onclick = async () => { try{ await navigator.clipboard.writeText(S.key); say("Key disalin."); }catch(e){ say("Gagal menyalin. Salin manual.", true); } };
  l.appendChild(d);
}

$("go").onclick = async () => {
  if(busy || S.key) return;
  busy = true; $("go").disabled = true;
  if(S.step >= 4){
    const d = await call("claim", {});
    if(d.key){ S.key = d.key; say("Key dibuat."); } else say(ERR[d.error] || "Gagal membuat key.", true);
    busy = false; render(); return;
  }
  const d = await call("begin", {});
  if(d.error){ say(ERR[d.error] || "Gagal terhubung ke server.", true); busy = false; render(); return; }
  location.href = LINKS[S.step];   // buka safelink di tab yang sama
};

(async () => {
  const ok = await sync();
  const q = new URLSearchParams(location.search).get("s");
  if(ok && q !== null){
    history.replaceState(null, "", location.pathname);
    const d = await call("complete", {n:parseInt(q, 10)});
    if(d.ok){ S.step = d.step; say(d.step < 4 ? "Tahap selesai. Tekan Lanjut untuk tahap berikutnya." : "Semua checkpoint selesai."); }
    else say(ERR[d.error] || "Gagal memverifikasi tahap.", true);
  }
  render();
})();
</script>
</body>
</html>
